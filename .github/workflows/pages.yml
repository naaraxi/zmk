name: pages

# Deploys the browser firmware flasher (openrgb/webflasher) to GitHub Pages.
# Requires repo Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [openrgb]
    paths:
      - 'openrgb/webflasher/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: openrgb/webflasher
      - id: deployment
        uses: actions/deploy-pages@v4
